<style>
:root {
  --green: #00ff41; --blue: #00b8ff; --red: #ff3131; --mint: #00e676;
  --bg: #050505;
  --bg-elev-1: rgba(20,20,20,.65);
  --bg-elev-2: rgba(15,25,35,.7);
  --bg-inset: rgba(10,10,10,.6);
  --line: #333;
  --line-soft: rgba(255,255,255,.08);
  --text: #e0e0e0; --text-muted: #a8b0b4;
  /* Enhanced from #6b7275 to pass WCAG 2.1 AA (Contrast Ratio > 5.2:1 against #050505) */
  --text-dim: #8c969a;

  --fs-xs: .78rem; --fs-sm: .86rem; --fs-base: 1rem;
  --fs-lg: clamp(1.05rem, 2.8vw, 1.25rem);
  --fs-xl: clamp(1.2rem, 3.4vw, 1.6rem);
  --fs-display: clamp(1.7rem, 6.4vw, 3rem);

  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 36px; --sp-7: 56px;
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 16px;

  --stage: clamp(240px, min(80vw, 56vh), 460px);
  --content: 1120px;
  --nav-h: 56px;
  --ease: cubic-bezier(.25, 1, .5, 1);
  --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --display: "Orbitron", system-ui, sans-serif;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-h) + 12px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font: var(--fs-base) / 1.65 var(--mono);
  text-rendering: optimizeLegibility;
}

main:focus { outline: none; }

img, video, svg { max-width: 100%; }
img, video { height: auto; }
a { color: var(--blue); }

:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 2px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: 50%; top: -100px; z-index: 200;
  transform: translateX(-50%);
  padding: 10px 18px;
  background: var(--green); color: #000;
  font-weight: 700; text-decoration: none;
  border-radius: 0 0 var(--radius-md) var(--radius-md);
  transition: top .2s var(--ease);
}
.skip-link:focus-visible { top: 0; }

/* ---------- Banner ---------- */
.project-banner {
  position: relative; z-index: 105;
  padding: 10px var(--sp-4);
  background: linear-gradient(180deg, rgba(0,255,65,.08), rgba(0,255,65,.02));
  border-bottom: 1px solid rgba(0,255,65,.55);
}

.banner-text {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
  gap: 10px var(--sp-3);
  max-width: var(--content); margin: 0 auto;
  font-size: clamp(.8rem, 2.6vw, .95rem);
  text-align: center;
}

.banner-badge {
  position: relative; isolation: isolate;
  flex: none;
  padding: 3px var(--sp-2);
  border-radius: 999px;
  background: var(--green); color: #000;
  font-size: var(--fs-xs); font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
}
.banner-badge::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  border-radius: inherit; border: 2px solid var(--green);
  animation: pulse-badge 2.4s infinite;
}
@keyframes pulse-badge {
  from { transform: scale(1);   opacity: .7; }
  to   { transform: scale(1.35, 1.7); opacity: 0; }
}

.banner-msg { flex: 1 1 260px; min-width: 0; }
.banner-msg::before { content: "> "; color: var(--green); }

.banner-btn {
  flex: none;
  padding: 6px var(--sp-3);
  border-radius: var(--radius-sm);
  background: var(--blue); color: var(--bg);
  font-size: var(--fs-sm); font-weight: 700; text-decoration: none; text-transform: uppercase;
  transition: background .25s, box-shadow .25s, transform .25s;
}
.banner-btn:hover, .banner-btn:focus-visible {
  background: var(--green);
  box-shadow: 0 0 14px rgba(0,255,65,.55);
  transform: translateY(-1px);
}

/* ---------- Hero ---------- */
.site-header {
  position: relative; isolation: isolate;
  display: grid; place-items: center; gap: var(--sp-3);
  min-height: min(660px, 88svh);
  padding: var(--sp-6) var(--sp-4) var(--sp-5);
  overflow: hidden;
  background: #000;
  border-bottom: 2px solid var(--green);
}

.site-header::before {
  content: ""; position: absolute; inset: -4%; z-index: -2; pointer-events: none;
  background:
    url("./header-bg.gif") center / cover no-repeat,
    radial-gradient(circle at 30% 25%, rgba(255,255,255,.10), transparent 45%),
    radial-gradient(circle at 72% 70%, rgba(0,184,255,.10), transparent 50%),
    #000;
  filter: grayscale(100%) contrast(1.2) brightness(.6);
  will-change: transform;
  animation: cosmic-move 40s infinite alternate linear;
}

.site-header::after {
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(255,255,255,.022) 0 1px, transparent 1px 3px),
    radial-gradient(circle at center, rgba(0,0,0,.05) 0%, rgba(0,0,0,.38) 60%, rgba(0,0,0,.78) 100%);
}

@keyframes cosmic-move { from { transform: scale(1.02); } to { transform: scale(1.16); } }

/* Logo Stage */
.animated-logo-stage {
  position: relative; z-index: 2; isolation: isolate;
  width: var(--stage); height: var(--stage);
}

.animated-logo-stage::before {
  content: ""; position: absolute; inset: 8%; z-index: -1; pointer-events: none;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,184,255,.14) 0%, rgba(0,184,255,.04) 45%, transparent 72%);
  filter: blur(12px);
}

.logo-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain; pointer-events: none;
}
.logo-img.is-missing { display: none; }

html.js .logo-img { opacity: 0; animation: logo-reveal 1.6s var(--ease) .3s forwards; }
@keyframes logo-reveal { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
html.js .logo-mono { animation: mono-in 2.6s ease 1.8s forwards; }
@keyframes mono-in { from { opacity: 0; } to { opacity: 1; } }

.logo-title {
  position: absolute; left: 50%; top: 67.6%; z-index: 3;
  transform: translate(-50%, -50%);
  font: 700 calc(var(--stage) * .058) / 1 "Cinzel Decorative", "Cinzel", Georgia, serif;
  letter-spacing: .09em; white-space: nowrap; pointer-events: none;
  color: #eaf6ff;
  background: linear-gradient(180deg, #ffffff 0%, #dff1ff 55%, #9fcdf0 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 5px rgba(0,184,255,.55)) drop-shadow(0 1px 1px rgba(0,0,0,.9));
}
html.js .logo-title { opacity: 0; animation: title-in 1.4s ease 3.4s forwards; }
@keyframes title-in { to { opacity: 1; } }

/* Sparkles */
.sparkle {
  position: absolute; z-index: 6; width: 3px; height: 3px;
  pointer-events: none; opacity: 0;
  background: #fff; border-radius: 50%;
  box-shadow: 0 0 4px 2px #fff, 0 0 8px 3px rgba(190,240,255,.7), 0 0 14px 5px rgba(0,184,255,.4);
  animation: twinkle var(--d) infinite ease-in-out var(--delay);
}
.s1 { top: 16%; left: 49%; --d: 2s;   --delay: 1.8s; }
.s2 { top: 45%; left: 16%; --d: 3.5s; --delay: 2s; }
.s3 { top: 38%; left: 83%; --d: 2.8s; --delay: 1.9s; }
.s4 { top: 72%; left: 22%; --d: 4s;   --delay: 2.2s; }
.s5 { top: 82%; left: 52%; --d: 2.5s; --delay: 2.1s; }

@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(.5); }
  50%      { opacity: .9; transform: scale(1.3); }
}

/* Title */
.header-title-block {
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-2);
  width: min(94vw, 950px);
  text-align: center;
}

.header-title-block h1 {
  max-width: 100%; margin: 0; padding: .1em .2em;
  color: #fff;
  font: 400 var(--fs-display) / 1.25 "Allura", "Segoe Script", cursive;
  overflow-wrap: break-word;
  text-shadow: 0 0 2px rgba(255,255,255,.92), 0 0 7px rgba(190,240,255,.48), 0 3px 9px #000;
}

.header-tagline {
  margin: 0;
  color: var(--text-muted);
  font-size: clamp(.72rem, 2.4vw, .9rem);
  letter-spacing: .14em; text-transform: uppercase;
}

.miga-mark {
  display: inline-flex; align-items: baseline;
  margin: 0; padding: 2px var(--sp-3) 3px;
  border: 1px solid var(--line-soft); border-radius: 999px;
  font: 700 clamp(.68rem, 2.2vw, .88rem) / 1 var(--display);
  letter-spacing: .2em; text-transform: uppercase;
}
.miga-m  { color: var(--red);  text-shadow: 0 0 5px rgba(255,49,49,.7); }
.miga-ig { color: #fff;        text-shadow: 0 0 5px rgba(255,255,255,.65); }
.miga-a  { color: var(--mint); text-shadow: 0 0 5px rgba(0,230,118,.7); }

html.js .header-title-block h1 { opacity: 0; animation: fade-up 1.4s ease 1.6s forwards; }
html.js .header-tagline        { opacity: 0; animation: fade-up 1.2s ease 1.9s forwards; }
html.js .miga-mark             { opacity: 0; animation: fade-up 1.2s ease 2.2s forwards; }

@keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Nav ---------- */
.site-nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(0,0,0,.9);
  border-bottom: 1px solid var(--line);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}

.nav-inner {
  display: flex; justify-content: center; flex-wrap: wrap;
  gap: var(--sp-1) var(--sp-2);
  max-width: var(--content); min-height: var(--nav-h);
  margin: 0 auto; padding: 10px var(--sp-4);
}

.site-nav a {
  padding: 6px 10px;
  color: #fff;
  font-size: 13px; font-weight: 700; letter-spacing: .04em;
  text-decoration: none; text-transform: uppercase; white-space: nowrap;
  transition: color .25s, text-shadow .25s;
}
.site-nav a::after {
  content: ""; display: block; width: 0; height: 2px; margin-top: 3px;
  background: var(--green);
  transition: width .25s var(--ease);
}
.site-nav a:hover, .site-nav a:focus-visible, .site-nav a[aria-current="page"] { color: var(--green); }
.site-nav a:hover, .site-nav a:focus-visible { text-shadow: 0 0 8px rgba(0,255,65,.75); }
.site-nav a:hover::after, .site-nav a:focus-visible::after, .site-nav a[aria-current="page"]::after { width: 100%; }

/* ---------- Layout ---------- */
.container { max-width: var(--content); margin: var(--sp-7) auto; padding: 0 18px; }

.section-title {
  display: inline-block;
  margin: 0 0 var(--sp-5); padding-bottom: var(--sp-1);
  color: #fff;
  border-bottom: 2px solid var(--blue);
  font: 700 var(--fs-xl) var(--display);
  letter-spacing: .1em; text-transform: uppercase;
}

/* Profile */
.profile-section {
  position: relative;
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center;
  gap: var(--sp-6); padding: var(--sp-6);
  overflow: hidden;
  background: var(--bg-elev-1);
  border: 1px solid var(--line); border-radius: var(--radius-lg);
  box-shadow: 0 10px 30px rgba(0,0,0,.55);
  transition: border-color .3s, box-shadow .3s, transform .3s;
}

/* Continuous, seamless scanline movement */
.profile-section::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to bottom, transparent calc(100% - 14px), rgba(0,255,65,.25) calc(100% - 3px), var(--green) 100%);
  opacity: .3;
  will-change: transform;
  animation: scanline 4s infinite linear;
}
@keyframes scanline { from { transform: translateY(-100%); } to { transform: translateY(100%); } }

.profile-section:hover {
  transform: translateY(-2px);
  border-color: var(--blue);
  box-shadow: 0 0 30px rgba(0,184,255,.18);
}

.profile-pic {
  width: min(240px, 58vw); aspect-ratio: 1;
  object-fit: cover;
  border: 4px solid var(--blue); border-radius: 50%;
  box-shadow: 0 0 24px rgba(0,184,255,.45);
  filter: grayscale(100%) contrast(1.1);
  transition: filter .5s, transform .5s var(--ease);
}
.profile-pic:hover { filter: none; transform: rotate(3deg) scale(1.03); }

.about-text > p { color: #cfd4d6; font-size: 1.02rem; line-height: 1.8; }
.about-text strong { color: var(--green); }

.tag-row { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin: 0 0 var(--sp-4); padding: 0; list-style: none; }
.tag-row li {
  padding: 3px 10px;
  border: 1px solid rgba(0,184,255,.35); border-radius: 999px;
  color: var(--blue); font-size: var(--fs-xs); letter-spacing: .06em; text-transform: uppercase;
}

.personal-verse {
  margin: var(--sp-5) 0; padding: var(--sp-4) var(--sp-5);
  background: rgba(0,184,255,.04);
  border-left: 2px solid var(--blue);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
}
.personal-verse p { margin: 6px 0; color: #d8f6ff; font-size: .95rem; font-style: italic; line-height: 1.7; }

.about-text .signature { margin-bottom: 0; color: var(--text-muted); }
.signature strong { font-size: 1.06rem; }

.research-interests-section { margin-top: var(--sp-7); padding-top: var(--sp-6); border-top: 1px dashed var(--line); }

/* ---------- Accordion ---------- */
.accordion-container { display: flex; flex-direction: column; gap: var(--sp-3); }

.accordion-item {
  overflow: hidden;
  background: rgba(20,20,20,.7);
  border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: var(--radius-md);
  transition: border-color .3s, box-shadow .3s;
}
.accordion-item:hover { border-color: var(--blue); box-shadow: 0 0 18px rgba(0,184,255,.14); }
.accordion-item.active { border-left-color: var(--green); }
.accordion-item > h3 { margin: 0; }

.accordion-header {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  width: 100%; padding: var(--sp-4) var(--sp-5);
  background: transparent; color: #fff; border: 0;
  font: 700 clamp(.95rem, 2.6vw, 1.1rem) / 1.4 var(--mono);
  text-align: left; cursor: pointer;
  transition: background .25s, color .25s;
}
.accordion-header:hover { background: rgba(0,184,255,.1); color: var(--green); }

.accordion-header .label { display: flex; align-items: baseline; gap: var(--sp-3); min-width: 0; }
.accordion-header .num { flex: none; color: var(--blue); font: 700 var(--fs-sm) var(--display); }
.accordion-header .icon { flex: none; color: var(--green); font-size: 1.1rem; transition: transform .3s var(--ease); }
.accordion-item.active .icon { transform: rotate(180deg); }

.accordion-content {
  display: grid; grid-template-rows: 0fr; visibility: hidden;
  background: var(--bg-inset);
  transition: grid-template-rows .38s var(--ease), visibility 0s .38s;
}
.accordion-item.active .accordion-content {
  grid-template-rows: 1fr; visibility: visible;
  transition: grid-template-rows .38s var(--ease);
}
.accordion-inner { min-height: 0; overflow: hidden; }
.accordion-body { padding: 18px var(--sp-5); }
.accordion-body > p:first-child { margin-top: 0; }

.research-subcard {
  margin-top: var(--sp-4); padding: var(--sp-5);
  background: var(--bg-elev-2);
  border: 1px solid rgba(0,184,255,.3); border-radius: var(--radius-md);
}
.research-subcard h4 {
  margin: 0 0 var(--sp-3); padding-bottom: 10px;
  color: var(--blue); font-size: var(--fs-lg);
  border-bottom: 1px solid rgba(0,184,255,.2);
}

/* ---------- Video + Playlist ---------- */
.video-playlist-container {
  display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
  gap: 18px; margin-top: 18px;
}

.main-video-box {
  min-width: 0; padding: var(--sp-3);
  background: #000;
  border: 1px solid var(--line); border-radius: var(--radius-md);
  box-shadow: 0 4px 20px rgba(0,0,0,.8);
}

.current-video-title {
  margin: 0 0 10px; padding-bottom: 6px;
  color: var(--blue); font-size: .92rem; font-weight: 700;
  border-bottom: 1px solid rgba(0,184,255,.2);
}

.main-video-player { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: var(--radius-sm); }

.playlist-box {
  min-width: 0; max-height: 430px; overflow-y: auto;
  padding: var(--sp-3);
  background: rgba(15,15,15,.8);
  border: 1px solid var(--line); border-radius: var(--radius-md);
  scrollbar-width: thin;
}

.playlist-box h5 {
  position: sticky; top: calc(var(--sp-3) * -1); z-index: 1;
  margin: 0 0 var(--sp-3); padding: 4px 0 var(--sp-2);
  background: rgba(15,15,15,.95);
  color: var(--green); font-size: .92rem;
  border-bottom: 1px solid var(--line);
}

.playlist { margin: 0; padding: 0; list-style: none; }

.playlist-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; margin-bottom: var(--sp-2); padding: 10px var(--sp-3);
  background: rgba(30,30,30,.6); color: var(--text);
  border: 0; border-left: 3px solid #555; border-radius: var(--radius-sm);
  font: 700 .86rem / 1.4 var(--mono);
  text-align: left; cursor: pointer;
  transition: background .25s, border-color .25s, color .25s;
}
.playlist-item:hover { background: rgba(0,184,255,.15); border-left-color: var(--blue); }
.playlist-item[aria-current="true"] { background: rgba(0,255,65,.12); border-left-color: var(--green); color: var(--green); }

.playlist-item .idx { flex: none; color: var(--text-dim); font: 700 var(--fs-xs) var(--display); }
.playlist-item[aria-current="true"] .idx { color: var(--green); }

/* ---------- Footer ---------- */
.site-footer {
  margin-top: var(--sp-7); padding: 28px 18px;
  background: #000; color: var(--text-dim);
  border-top: 1px solid #222;
  font-size: 13px; text-align: center;
}
.site-footer p { margin: 4px 0; }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .video-playlist-container { grid-template-columns: 1fr; }
  .playlist-box { max-height: 300px; }
}

@media (max-width: 768px) {
  .site-header { min-height: auto; padding: var(--sp-5) var(--sp-4); }
  .container { margin: var(--sp-6) auto; }
  .profile-section { grid-template-columns: 1fr; justify-items: center; padding: var(--sp-5) 18px; text-align: center; }
  .tag-row { justify-content: center; }
  .personal-verse { text-align: left; }
}

@media (max-width: 560px) {
  .banner-text { flex-direction: column; gap: var(--sp-2); }
  .nav-inner {
    flex-wrap: nowrap; justify-content: flex-start;
    overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
  }
  .nav-inner::-webkit-scrollbar { display: none; }
  .site-nav a { scroll-snap-align: center; }
}

/* ---------- Reduced Motion Mode ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
